<svg xmlns="http://www.w3.org/2000/svg" class="on-pig-art" viewBox="0 0 1312 1199" role="img" aria-label="Pink piggy bank with lime coin stacks"><defs><image id="on-pig-source" href="piggy-with-coins.png" width="1312" height="1199" />
 <radialGradient id="on-eyelid-feather"><stop offset=".72" stop-color="white" /><stop offset="1" stop-color="black" /></radialGradient><mask id="on-eyelid-mask"><ellipse cx="944" cy="512" rx="61" ry="84" fill="url(#on-eyelid-feather)" /></mask><clipPath id="on-eye-cut"><ellipse cx="944" cy="512" rx="38" ry="60" transform="rotate(-12 944 512)" /></clipPath>
 <linearGradient id="on-skin" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fa5e93" /><stop offset=".55" stop-color="#f25086" /><stop offset="1" stop-color="#ee4c80" /></linearGradient>
 </defs><use href="#on-pig-source" /><g class="on-mascot-eyelid">
